[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structural-friction-modeling"
version = "0.1.0"
description = "Causal inference framework for modeling portfolio risk during liquidity vacuums and trading halts."
authors = [
    { name = "Kenneth LeGare" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "pymongo>=4.5.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
causal = [
    "dowhy>=0.11.1",
    "networkx>=3.1",
]
uplift = [
    "causalml>=0.14.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "jupyterlab>=4.0.0",
    "seaborn>=0.13.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP"   # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
